version: 2

models:
  - name: dim_channel
    description: >
      Gold channel dimension containing one row per standardised channel,
      plus an Unknown member for missing or unmatched channel references.

    columns:
      - name: channel_key
        description: >
          Warehouse surrogate key identifying each channel dimension member.
        data_tests:
          - not_null
          - unique

      - name: channel_code
        description: >
          Natural business key identifying the channel.
        data_tests:
          - not_null
          - unique

      - name: channel_name
        description: Human-readable channel name.

      - name: channel_group
        description: High-level grouping of the channel.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Digital
                  - Physical
                  - Assisted
                  - Unknown

      - name: channel_type
        description: Descriptive classification of the channel.

  - name: dim_scam_types
    description: >
      Gold scam type dimension containing one row per standardised scam type,
      plus an Unknown member.

    columns:
      - name: scam_type_key
        description: Warehouse surrogate key for the scam type.
        data_tests:
          - unique
          - not_null

      - name: scam_type_code
        description: Natural business key identifying the scam type.
        data_tests:
          - unique
          - not_null

      - name: scam_type_name
        description: Human-readable scam type name.

      - name: scam_category
        description: High-level scam category.

      - name: scam_description
        description: Description of the scam type.

      - name: active_flag
        description: Indicates whether the scam type is active.

  - name: dim_rules
    description: >
      Gold fraud/scam rule dimension containing one row per current rule,
      plus Unknown Rule and No Rule Triggered special members.

    columns:
      - name: rule_key
        description: Warehouse surrogate key for the rule.
        data_tests:
          - unique
          - not_null

      - name: rule_id
        description: Natural business key identifying the rule.
        data_tests:
          - unique
          - not_null

      - name: rule_name
        description: Human-readable rule name.

      - name: rule_category
        description: Business category of the rule.

      - name: rule_description
        description: Description of the rule.

      - name: rule_version
        description: Current rule version.

      - name: is_active
        description: Indicates whether the rule is currently active.

      - name: rule_start_date
        description: Date the rule became effective.

      - name: rule_end_date
        description: Date the rule ceased being effective.

      - name: rule_last_updated
        description: Timestamp of the latest known rule update.

  - name: dim_products
    description: >
      Gold product dimension containing one row per current standardised
      product_code, plus an Unknown member for missing or unmatched product references.

    columns:
      - name: product_key
        description: Warehouse surrogate key for the product.
        data_tests:
          - unique
          - not_null

      - name: product_code
        description: Natural business key identifying the product.
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: Name of banking product.

      - name: product_category
        description: High-level product category.

      - name: is_active
        description: Indicates whether the product is currently active.

      - name: effective_start_date
        description: Date the product became effective.

      - name: effective_end_date
        description: Date the product ceased being effective.

  - name: dim_customers
    description: >
      Gold customer dimension containing one row per current standardised
      customer_id, plus an Unknown member for missing or unmatched customer references.
      Provides customer context for analysing fraud/scam cases, losses,
      customer risk and customer segments.

    columns:
      - name: customer_key
        description: >
          Warehouse surrogate key identifying each customer dimension member.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Natural business key identifying the customer.
        data_tests:
          - unique
          - not_null

      - name: customer_type
        description: >
          Business classification of the customer.

      - name: date_of_birth
        description: >
          Customer date of birth. Invalid source dates are retained as NULL
          rather than replaced with an artificial date.

      - name: state
        description: >
          Standardised state or territory associated with the customer.

      - name: postcode
        description: >
          Customer postcode used for geographic analysis.

      - name: customer_since_date
        description: >
          Date the customer relationship commenced.

      - name: risk_rating
        description: >
          Current customer risk classification used for fraud and risk analysis.

      - name: customer_segment
        description: >
          Business-defined customer segment used for reporting and analysis.

      - name: record_created_at
        description: >
          Timestamp the customer record was originally created in the source data.

      - name: record_updated_at
        description: >
          Timestamp of the latest known update to the customer record.

  - name: dim_accounts
    description: >
      Gold account dimension containing one row per current standardised
      account_id, plus an Unknown member for missing or unmatched account references.
      Provides account context for analysing fraud/scam cases, financial exposure,
      account type, account status and account ownership characteristics.

    columns:
      - name: account_key
        description: >
          Warehouse surrogate key identifying each account dimension member.
        data_tests:
          - unique
          - not_null

      - name: account_id
        description: >
          Natural business key identifying the account.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Standardised customer identifier associated with the account.

      - name: product_code
        description: >
          Standardised banking product code associated with the account.

      - name: account_type
        description: >
          Business classification of the account.

      - name: account_status
        description: >
          Current status of the account.

      - name: account_open_date
        description: >
          Date the account was opened.

      - name: account_close_date
        description: >
          Date the account was closed, where applicable.

      - name: is_joint_account
        description: >
          Indicates whether the account is jointly owned.

      - name: record_updated_at
        description: >
          Timestamp of the latest known update to the account record.